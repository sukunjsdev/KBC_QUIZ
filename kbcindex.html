<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC Quiz Application</title>
    <link rel="stylesheet" href="kbcstyle.css">
</head>

<body>
    <!-- layout1 -->
    <div class="layout1">
        <button class="layout1_btn_start">START</button>
        <button class="layout1_btn_theme">DARK/LIGHT</button>
    </div>
    <!-- layout2 -->
    <div class="layout2">
        <section class="round_score">
            <p class="Round">Round 1 / 3</p>
            <button class="restart">&#8635;</button>
            <p class="Score same_theme">Score:<span class="Score_span"> 300</span></p>
        </section>
        <section class="progress-container">
                <div class="progress-bar"></div>
        </section>
        <section class="que_out_5_time">
            <p class="que_out_5  same_theme">QUESTION <span class="que_no_diplay">asdf</span> OF 5</p>
            <p class="time_clock">&#128336; <span>00:30</span></p>
        </section>
        <section class="full_question">
            <P class="question  same_theme"></P>
        </section>
        <section class="Option_menu">
            <button class="option_one options  same_theme">
                <span class="btn_a btn">A</span>
                JSON.object()
            </button>
            <button class="option_two options  same_theme">
                <span class="btn_b btn">B</span>
                JSON.conver()
            </button>
            <button class="option_three options  same_theme">
                <span class="btn_c btn">C</span>
                JSON.parse()
            </button>
            <button class="option_four options  same_theme">
                <span class="btn_d btn">D</span>
                JSON.stringify()
            </button>
        </section>
        <hr>
        <section class="difficulty_submit">
            <p class="diff_line  same_theme">Difficulty:<span class="diff_value">Medium(+200 pts)</span></p>
            <button class="btn_submit_ans">Submit Answer</button>
        </section>
    </div>
    <div class="EachRound">
        <img class=eachround_img src="https://imgs.search.brave.com/FLbma69k8-XVMuESfk8ov_2kgYCYfNbEE4eMDNMozk0/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9zdGF0/aWMudmVjdGVlenku/Y29tL3N5c3RlbS9y/ZXNvdXJjZXMvdGh1/bWJuYWlscy8wMjMv/MjA0LzgzMS9zbWFs/bC9nb2xkZW4tY29u/ZmV0dGktYW5kLXJp/YmJvbi1ibGFzdC1p/bGx1c3RyYXRpb24t/Y2Fybml2YWwtY2Vs/ZWJyYXRpb24tZWxl/bWVudHMtZXhwbG9z/aW9uLWdvbGRlbi1j/b25mZXR0aS1hbmQt/dGluc2VsLWZhbGxp/bmctb24tYS10cmFu/c3BhcmVudC1iYWNr/Z3JvdW5kLWZlc3Rp/dmFsLWFuZC1hbm5p/dmVyc2FyeS1jZWxl/YnJhdGlvbi1mcmVl/LXBuZy5wbmc" alt="celebration_img">
        <img class=eachround_img2 src="https://imgs.search.brave.com/dr4aqdrEhLRco1Sn5mmDYCYcIuYeVIuBwRuAqArtZXY/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9zdGF0/aWMudmVjdGVlenku/Y29tL3N5c3RlbS9y/ZXNvdXJjZXMvdGh1/bWJuYWlscy8wNzQv/ODU4LzUxOS9zbWFs/bC9yaXNlLWFuZC1m/bG9hdC1hbmltYXRp/b24tb2YtY2FydG9v/bi1vZi1jb29sLWd1/eS12aWRlby5qcGc" alt="cartoon_img">
        <section class="eachsec">
            <h3 class="eachround_heading">WELL DONE</h3>
            <i class="eachround_i">you did well!</i>
            <button class="for_next_rount_btn">click for net round_score</button>
        </section>
    </div>
    <div class="finallayout">
        <img src="https://imgs.search.brave.com/2eJ90WCnzSPozmk5Wo2WjakwA9q7yYNyQ7jX3dKd4Nc/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9haGFz/bGlkZXMuY29tL3dw/LWNvbnRlbnQvdXBs/b2Fkcy8yMDIxLzEy/L1llYXItRW5kLVJl/dmlldy0xLTEwMjR4/NTc2LnBuZw" alt="final_img">
        <div class="finaldiv">
            <p class="scorefinal"></p>
            <p>Total question:15</p>
            <p class="rightanswer"></p>
            <p class="incorrectanswer"></p>
            <p class="unanswered"></p>
            <p>Three rounds Completed</p>
        </div>
    </div>
    <script src="kbcscript.js"></script>
</body>

</html>
